name: site-checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Garde anti-numéro et sécurité du site
        run: |
          set -e
          for f in security/*.test.mjs tests/*.test.mjs; do echo "== $f"; node "$f"; done
